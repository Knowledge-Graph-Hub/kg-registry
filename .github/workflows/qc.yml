name: kg-registry QC

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ "3.10", "3.11" ]

    # setup-uv's python-version input did not bind: uv fell through to
    # /usr/bin/python3 and both matrix legs silently tested the runner's 3.12.
    # UV_PYTHON is what uv actually reads, so the matrix now selects the
    # interpreter for every uv command in the job.
    env:
      UV_PYTHON: ${{ matrix.python-version }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync --dev

      # Print it, so a matrix that stops binding is visible in the log.
      - name: Report interpreter under test
        run: uv run python -VV

      - name: Run linter
        run: uv run tox -e lint

      - name: Check code quality with flake8
        run: uv run tox -e flake8

      - name: Check static typing with MyPy
        run: uv run tox -e mypy

      # pytest, not `unittest discover`: most of this suite is pytest-style
      # functions, which unittest walks past silently (18 of 139 collected).
      # Tests marked `network` reach live external services and are excluded
      # here to keep CI deterministic; run them locally with `pytest -m network`.
      - name: Run tests
        run: uv run pytest tests/ -m "not network"
